<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberAware | Register</title>
    <link rel="stylesheet" href="./css/register.css">
</head>
<body>
    <div class="auth-container">
        <h2>Join the Cyber Shield</h2>
        <p>Level up your digital safety skills.</p>
        
        <form id="registerForm">
            <div class="input-group">
                <label for="userName">Username</label>
                <input type="text" id="userName" name="userName" required autocomplete="username">
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <div class="password-wrapper">
                    <input type="password" id="password" name="password" required autocomplete="new-password">
                    <button type="button" id="togglePassword" class="toggle-btn">Show</button>
                </div>
            </div>

            <button type="submit" id="regBtn">Enlist Now</button>
        </form>

        <div id="message" class="hidden"></div>
    </div>

    <script src="./js/register.js"></script>
</body>
</html>
