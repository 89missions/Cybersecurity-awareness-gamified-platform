<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberAgent Training · Quiz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/dashboard.css"> <!-- Your existing dashboard CSS -->
    <link rel="stylesheet" href="./css/quiz.css"> <!-- Quiz specific styles -->
</head>
<body>
    <div class="dashboard-container">
        <!-- SIDEBAR - exactly the same as dashboard -->
        <aside class="sidebar">
            <div class="logo-area">
                <h1>CYBER<span>AGENT</span></h1>
            </div>
            <nav class="nav-menu">
                <a href="dashboard.html" class="nav-item">📊 DASHBOARD</a>
                <a href="#" class="nav-item active">🎯 TRAINING</a>
                <a href="#" class="nav-item">📜 REPORTS</a>
                <a href="#" class="nav-item">⚙️ SETTINGS</a>
            </nav>
            <div class="sidebar-footer" style="color: var(--text-dim); font-size: 0.7rem; border-top: 1px solid var(--border); padding-top: 1rem;">
                <span>v1.0 · SECURE MODE</span>
            </div>
        </aside>

        <!-- MAIN QUIZ WORKSPACE -->
        <main class="main-content" id="quizMain">
            <!-- TOP BAR (matches dashboard exactly) -->
            <div class="top-bar">
                <div class="agent-profile">
                    <div class="avatar-circle" id="avatarInitials">AG</div>
                    <div>
                        <div style="font-size: 0.7rem; color: var(--text-dim);">ACTIVE AGENT</div>
                        <div style="font-weight: 700;" id="agentName">Loading...</div>
                    </div>
                </div>
                <div class="xp-progress-section" style="width: 320px;">
                    <div class="xp-header">
                        <span>SESSION PROGRESS</span>
                        <span id="quizProgressText">0/10</span>
                    </div>
                    <div class="xp-track">
                        <div class="xp-bar" id="quizProgressBar" style="width: 0%;"></div>
                    </div>
                </div>
            </div>

            <!-- QUIZ CONTAINER (dynamic content) -->
            <div id="quizContainer">
                <!-- Module header -->
                <div style="display: flex; align-items: center; gap: 0.8rem; margin-bottom: 2rem;">
                    <span style="font-size: 2rem;" id="moduleIcon">⚠️</span>
                    <h2 style="margin: 0; font-family: 'JetBrains Mono', monospace;" id="moduleTitle">Loading module...</h2>
                </div>

                <!-- Question card will be injected here -->
                <div id="questionArea">
                    <!-- Dynamic content from JavaScript -->
                </div>

                <!-- Navigation buttons -->
                <div style="display: flex; justify-content: space-between; margin-top: 2.5rem;" id="navButtons">
                    <!-- Filled by JavaScript -->
                </div>

                <!-- Activity log (same as dashboard) -->
                <div class="panel" style="margin-top: 2.5rem;">
                    <h3>📋 QUIZ LOG</h3>
                    <div class="log-list" id="activityLog">
                        <p class="log-entry">> Initializing secure quiz environment...</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="./js/quiz.js"></script>
</body>
</html>
